type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
    description: Contact id
    example: 68975d28d412ccd1953253a5
  name:
    type: string
    description: Contact name
    example: Natalie Sheeran
  phoneNumber:
    type: string
    description: Contact phone number
    example: '+380000000002'
  email:
    type: string
    description: Contact email
    example: karina@mail.com
  isFavourite:
    type: boolean
    description: Contact isFavourite
    example: false
    default: false
  contactType:
    type: string
    description: Contact type
    enum: ['work', 'personal', 'home']
  ownerId:
    type: string
    description: Owner id
    example: 68975d28d412ccd1953253a5
  photo:
    type: string
    description: Contact photo
    default: null
  createdAt:
    type: string
    format: date-time
    example: 2025-07-28T22:12:26.669+00:00
  updatedAt:
    type: string
    format: date-time
    example: 2025-07-28T22:12:26.669+00:00
