tags:
  - Contacts
summary: Add contact
operationId: createContact
description: Add contact
security:
  - bearerAuth: []

requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
          - photo
        properties:
          name:
            type: string
            description: Contact name
            example: John Jentle
          phoneNumber:
            type: string
            description: Contact phone phoneNumber
            example: '+380000000002'
          email:
            type: string
            description: Contact email
            example: karina@mail.com
          isFavourite:
            type: boolean
            description: Contact IsFavourite
            example: false
            default: false
          contactType:
            type: string
            description: Contact type
            enum: ['work', 'personal', 'home']
          photo:
            type: string
            format: binary
            description: Contact photo
            default: null
responses:
  '201':
    description: Successfully created contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully found contacts!!
            data:
              $ref: ../../components/schemas/contact.yaml
  '400':
    $ref: ../../components/responces/400.yaml
  '401':
    $ref: '../../components/responces/401.yaml'
  '500':
    $ref: ../../components/responces/500.yaml
