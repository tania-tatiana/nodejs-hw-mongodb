tags:
  - Contacts
summary: Change contact by id
operationId: updateContact
description: Change contact by id
security:
  - bearerAuth: []

parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: 68975d28d412ccd1953253a5

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Contact name
            example: John Jentle
          phoneNumber:
            type: string
            description: Contact phone number
            example: '+380000000002'
          email:
            type: string
            description: Contact email
            example: karina@mail.com
          isFavourite:
            type: boolean
            description: Contact IsFavourite
            example: false
            default: false
          contactType:
            type: string
            description: Contact type
            enum: ['work', 'personal', 'home']
          photo:
            type: string
            format: binary
            description: Contact photo

responses:
  '200':
    description: Succesfully changed contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responces/401.yaml'
  '404':
    description: Not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: '../../../components/responces/500.yaml'
